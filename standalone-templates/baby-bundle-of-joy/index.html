<style>
/* =========================================================================================
   THEME — every colour, font, spacing step, radius and timing lives here.
   ========================================================================================= */
:root {
  /* Palette */
  --c-cream: #FFF8EF;
  --c-peach: #FFD7BF;
  --c-pink: #FFC4D6;
  --c-pink-deep: #FF8FB0;
  --c-blue: #BFE3FF;
  --c-blue-deep: #7FC3F2;
  --c-mint: #C8F0DF;
  --c-mint-deep: #7FD4B1;
  --c-lavender: #DCCBFF;
  --c-lavender-deep: #A98BEA;
  --c-yellow: #FFE7A3;
  --c-yellow-deep: #FFC94D;
  --c-ink: #463650;          /* main text: dark plum, readable on every pastel */
  --c-ink-soft: #6E5C78;
  --c-accent: #E8638C;       /* buttons / highlights */
  --c-accent-2: #8B6FE0;
  --c-white-glass: rgba(255, 255, 255, 0.72);
  --c-whatsapp: #25D366;

  /* Typography */
  --font-display: "Fredoka", "Nunito", ui-rounded, system-ui, sans-serif;
  --font-script: "Dancing Script", "Segoe Script", cursive;
  --font-body: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  --fs-xs: 0.78rem;
  --fs-sm: 0.92rem;
  --fs-md: 1.05rem;
  --fs-lg: clamp(1.25rem, 4.6vw, 1.6rem);
  --fs-xl: clamp(1.9rem, 8.4vw, 3.2rem);
  --fs-name: clamp(3.1rem, 15vw, 5.6rem);

  /* Spacing */
  --sp-1: 0.25rem;
  --sp-2: 0.5rem;
  --sp-3: 0.75rem;
  --sp-4: 1rem;
  --sp-5: 1.5rem;
  --sp-6: 2rem;
  --sp-7: 3rem;
  --sp-8: 4.5rem;
  --gutter: max(16px, env(safe-area-inset-left));

  /* Shape & depth */
  --r-sm: 12px;
  --r-md: 20px;
  --r-lg: 30px;
  --r-pill: 999px;
  --shadow-soft: 0 18px 40px rgba(120, 90, 160, 0.16), 0 4px 12px rgba(120, 90, 160, 0.08);
  --shadow-lift: 0 26px 60px rgba(120, 90, 160, 0.24), 0 6px 16px rgba(120, 90, 160, 0.12);

  /* Motion */
  --dur-fast: 180ms;
  --dur-med: 480ms;
  --dur-slow: 900ms;
  --ease-out: cubic-bezier(.2, .8, .2, 1);
  --ease-bounce: cubic-bezier(.34, 1.56, .64, 1);
  --float-distance: 10px;
}

/* =========================================================================================
   BASE
   ========================================================================================= */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: var(--font-body);
  color: var(--c-ink);
  background: var(--c-cream);
  line-height: 1.55;
  overflow-x: clip;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }
button { font: inherit; color: inherit; }
a { color: inherit; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 3px solid var(--c-accent-2); outline-offset: 3px; border-radius: 10px; }
html.lightbox-open { overflow: hidden; }

/* Sections after the opening screen stay hidden until a balloon is popped (JS adds .is-open). */
.js body:not(.is-open) .after-open { display: none; }

.section { position: relative; padding: var(--sp-8) var(--gutter); overflow: hidden; }
.container { width: 100%; max-width: 980px; margin: 0 auto; position: relative; z-index: 2; }
.eyebrow { font-family: var(--font-display); font-weight: 600; font-size: var(--fs-xs); letter-spacing: .26em; text-transform: uppercase; color: var(--c-accent); text-align: center; margin: 0; }
.section-title { font-family: var(--font-display); font-weight: 600; font-size: var(--fs-xl); line-height: 1.1; text-align: center; margin: var(--sp-2) 0 var(--sp-6); }
.section-title .sparkle-word { background: linear-gradient(90deg, var(--c-accent), var(--c-accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* Scroll reveal (IntersectionObserver adds .in) */
[data-reveal] { opacity: 0; transform: translateY(26px) scale(.98); transition: opacity var(--dur-slow) var(--ease-out), transform var(--dur-slow) var(--ease-out); transition-delay: var(--d, 0ms); }
[data-reveal].in { opacity: 1; transform: none; }

/* Shared buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .55em;
  min-height: 48px; padding: .75em 1.4em; border-radius: var(--r-pill); border: 0; cursor: pointer;
  font-family: var(--font-display); font-weight: 600; font-size: var(--fs-md); text-decoration: none;
  transition: transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast), filter var(--dur-fast);
  -webkit-tap-highlight-color: transparent;
}
.btn svg { width: 1.2em; height: 1.2em; flex: none; }
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(0) scale(.97); }
.btn-primary { background: linear-gradient(135deg, #F583A7, var(--c-accent)); color: #fff; box-shadow: 0 12px 26px rgba(232, 99, 140, .35); }
.btn-secondary { background: linear-gradient(135deg, #A992F2, var(--c-accent-2)); color: #fff; box-shadow: 0 12px 26px rgba(139, 111, 224, .32); }
.btn-ghost { background: #fff; color: var(--c-ink); box-shadow: inset 0 0 0 2px rgba(139, 111, 224, .25), 0 8px 18px rgba(120, 90, 160, .12); }
.btn-whatsapp { background: var(--c-whatsapp); color: #fff; box-shadow: 0 12px 26px rgba(37, 211, 102, .32); }

/* Floating decoration helpers */
@keyframes float-y { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(calc(var(--float-distance) * -1)); } }
@keyframes float-tilt { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(calc(var(--float-distance) * -1.2)) rotate(3deg); } }
@keyframes twinkle { 0%, 100% { opacity: .25; transform: scale(.7) rotate(0deg); } 50% { opacity: 1; transform: scale(1.1) rotate(25deg); } }
@keyframes drift-x { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }
.floaty { animation: float-y 6s ease-in-out infinite; }
.deco { position: absolute; pointer-events: none; z-index: 1; }
.deco-star { width: 18px; height: 18px; animation: twinkle 3.2s ease-in-out infinite; }

/* =========================================================================================
   FIXED CONTROLS (sound, replay) + TOAST + CONFETTI CANVAS
   ========================================================================================= */
.top-controls { position: fixed; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); z-index: 40; display: flex; gap: var(--sp-2); }
.icon-btn {
  width: 46px; height: 46px; border-radius: 50%; border: 0; cursor: pointer;
  background: rgba(255,255,255,.94);
  box-shadow: 0 8px 20px rgba(120, 90, 160, .18); display: grid; place-items: center; color: var(--c-ink);
  transition: transform var(--dur-fast) var(--ease-out);
}
.icon-btn:hover { transform: scale(1.06); }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn[hidden] { display: none; }
.toast {
  position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); z-index: 70; transform: translate(-50%, 180%); visibility: hidden;
  background: var(--c-ink); color: #fff; padding: .8em 1.3em; border-radius: var(--r-pill); font-weight: 700; font-size: var(--fs-sm);
  box-shadow: var(--shadow-lift); transition: transform var(--dur-med) var(--ease-bounce); max-width: calc(100vw - 32px); text-align: center; pointer-events: none;
}
.toast.show { transform: translate(-50%, 0); visibility: visible; }
.toast.error { background: #B4405F; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

/* =========================================================================================
   1. OPENING SCREEN
   ========================================================================================= */
.intro {
  position: relative; min-height: 100vh; min-height: 100svh; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: max(56px, calc(env(safe-area-inset-top) + 40px)) var(--gutter) max(22px, env(safe-area-inset-bottom));
  background:
    radial-gradient(60% 40% at 50% 0%, rgba(255, 255, 255, .95), transparent 70%),
    radial-gradient(70% 50% at 100% 60%, rgba(220, 203, 255, .55), transparent 70%),
    radial-gradient(70% 50% at 0% 75%, rgba(191, 227, 255, .55), transparent 70%),
    linear-gradient(180deg, #FFF6EE 0%, #FFE6EE 45%, #EFE6FF 100%);
}
.intro .layer { position: absolute; inset: 0; pointer-events: none; will-change: transform; }
.intro .cloud { position: absolute; opacity: .95; }
.intro .cloud.c1 { width: min(46vw, 260px); top: 9%; left: -8%; animation: float-y 9s ease-in-out infinite; }
.intro .cloud.c2 { width: min(38vw, 220px); top: 22%; right: -10%; animation: float-y 11s ease-in-out infinite -3s; }
.intro .cloud.c3 { width: min(58vw, 340px); bottom: -2%; left: -14%; opacity: .95; animation: float-y 12s ease-in-out infinite -5s; }
.intro .cloud.c4 { width: min(54vw, 320px); bottom: -4%; right: -16%; opacity: .95; animation: float-y 10s ease-in-out infinite -2s; }
.intro .cloud.drift { width: 120px; top: 4%; left: 0; opacity: .7; animation: drift-x 48s linear infinite; }
.butterfly { position: absolute; width: 40px; top: 30%; left: 0; animation: butterfly-path 26s linear infinite; }
.butterfly.b2 { top: 58%; width: 32px; animation-duration: 33s; animation-delay: -14s; }
.butterfly img { width: 100%; height: auto; animation: flap .3s ease-in-out infinite alternate; }
@keyframes flap { from { transform: scaleX(1); } to { transform: scaleX(.45); } }
@keyframes butterfly-path {
  0% { transform: translate(-12vw, 0) rotate(8deg); }
  25% { transform: translate(25vw, -7vh) rotate(-6deg); }
  50% { transform: translate(58vw, 3vh) rotate(10deg); }
  75% { transform: translate(86vw, -5vh) rotate(-4deg); }
  100% { transform: translate(114vw, 2vh) rotate(6deg); }
}

.intro-text { position: relative; z-index: 5; max-width: 620px; }
/* Soft cream glow behind the opening text keeps it readable over clouds and stars. */
.intro-text::before { content: ""; position: absolute; inset: -22px -34px -14px; z-index: -1; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 249, 245, .92), rgba(255, 249, 245, .6) 60%, rgba(255, 249, 245, 0)); }
.intro .kicker {
  display: inline-flex; align-items: center; gap: .5em; margin: 0; padding: .45em 1.1em; border-radius: var(--r-pill);
  background: rgba(255,255,255,.75); box-shadow: 0 6px 16px rgba(232, 99, 140, .14);
  font-family: var(--font-display); font-weight: 600; font-size: var(--fs-xs); letter-spacing: .18em; text-transform: uppercase; color: var(--c-accent);
  animation: rise-in var(--dur-slow) var(--ease-out) both .1s;
}
.intro h1 {
  font-family: var(--font-display); font-weight: 700; font-size: var(--fs-xl); line-height: 1.04; margin: var(--sp-3) 0 var(--sp-2);
  background: linear-gradient(100deg, #E8638C 0%, #B36BD8 55%, #6F8FE8 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 0 rgba(255,255,255,.9)); animation: rise-in var(--dur-slow) var(--ease-out) both .25s;
}
.intro .subtitle { margin: 0 auto; max-width: 30ch; font-size: clamp(.95rem, 3.8vw, 1.15rem); color: var(--c-ink-soft); font-weight: 600; animation: rise-in var(--dur-slow) var(--ease-out) both .4s; }
.intro .who { margin: var(--sp-3) 0 0; font-family: var(--font-display); font-weight: 500; font-size: var(--fs-sm); color: var(--c-ink-soft); animation: rise-in var(--dur-slow) var(--ease-out) both .55s; }
.intro .who strong { font-family: var(--font-script); font-size: 1.7em; font-weight: 700; color: var(--c-accent); display: block; line-height: 1.15; }
@keyframes rise-in { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

.stage { position: relative; z-index: 4; flex: 1; width: 100%; max-width: 900px; display: grid; place-items: center; min-height: 230px; margin-top: var(--sp-2); }
.hero-baby { width: min(64vw, 44svh, 400px); animation: float-y 6s ease-in-out infinite; }
.hero-wrap { position: relative; animation: pop-in 1s var(--ease-bounce) both .5s; }
@keyframes pop-in { from { opacity: 0; transform: scale(.8) translateY(20px); } to { opacity: 1; transform: none; } }

/* Balloons: the button is the balloon itself (its rounded shape is the tap area, so a string
   never blocks a neighbour). The string hangs below and can fall away on its own. */
.balloon {
  --bw: clamp(72px, 20vw, 116px);
  position: absolute; width: var(--bw); height: calc(var(--bw) * 1.25); padding: 0; border: 0; background: none; cursor: pointer; z-index: 6;
  border-radius: 50% 50% 48% 48% / 56% 56% 44% 44%;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  animation: balloon-float var(--fd, 6s) ease-in-out infinite var(--fdelay, 0s), balloon-in 1s var(--ease-bounce) both var(--in, .6s);
}
.balloon .b-body { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; transform-origin: 50% 60%; transition: transform var(--dur-fast) var(--ease-bounce); }
.balloon .b-string { position: absolute; left: 50%; top: 94%; width: 34%; height: 72%; margin-left: -17%; pointer-events: none; overflow: visible; transform-origin: 50% 0; animation: sway 3s ease-in-out infinite alternate; }
.balloon .b-burst { position: absolute; left: 50%; top: 45%; width: 120%; aspect-ratio: 1; margin-left: -60%; translate: 0 -50%; border-radius: 50%; pointer-events: none; opacity: 0; border: 4px dotted var(--burst, #FFB3CB); }
.balloon:hover .b-body, .balloon:focus-visible .b-body { transform: scale(1.09); }
.balloon.press .b-body { animation: squish .32s var(--ease-bounce); }
.balloon.b1 { left: 1%; top: 2%; --fd: 6.4s; --in: .7s; }
.balloon.b2 { right: 1%; top: 6%; --fd: 7.6s; --fdelay: -2s; --in: .85s; }
.balloon.b3 { left: 1%; top: 50%; --fd: 5.8s; --fdelay: -1s; --in: 1s; }
.balloon.b4 { right: 1%; top: 46%; --fd: 7s; --fdelay: -3s; --in: 1.15s; }
@keyframes balloon-float { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-14px) rotate(3deg); } }
@keyframes balloon-in { from { opacity: 0; translate: 0 60px; } to { opacity: 1; translate: 0 0; } }
@keyframes sway { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
@keyframes squish { 0% { transform: scale(1); } 40% { transform: scale(1.14, .9); } 100% { transform: scale(1.09); } }
/* Pop: stretch, burst ring, string drops; confetti comes from the canvas */
.balloon.popping { animation-play-state: paused; pointer-events: none; }
.balloon.popping .b-body { animation: pop .34s ease-in forwards; }
.balloon.popping .b-string { animation: string-fall .9s ease-in forwards; }
.balloon.popping .b-burst { animation: burst .45s ease-out forwards; }
@keyframes pop { 0% { transform: scale(1.09); opacity: 1; } 45% { transform: scale(1.32, 1.22); opacity: 1; } 100% { transform: scale(.15); opacity: 0; } }
@keyframes string-fall { to { transform: translateY(140px) rotate(28deg); opacity: 0; } }
@keyframes burst { 0% { opacity: .95; transform: scale(.35); } 100% { opacity: 0; transform: scale(1.25); } }

.tap-hint {
  position: relative; z-index: 7; margin: var(--sp-3) 0 0; padding: .7em 1.3em; border-radius: var(--r-pill);
  background: rgba(255,255,255,.85); box-shadow: var(--shadow-soft); font-family: var(--font-display); font-weight: 600; font-size: clamp(.92rem, 3.8vw, 1.05rem); color: var(--c-ink);
  animation: hint-bob 2.2s ease-in-out infinite, rise-in var(--dur-slow) var(--ease-out) both 1.2s;
}
@keyframes hint-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
body.is-open .tap-hint { visibility: hidden; }

/* =========================================================================================
   2. INVITATION REVEAL
   ========================================================================================= */
.reveal-section { background: linear-gradient(180deg, #EFE6FF 0%, #FFF3EA 55%, #FFF8EF 100%); padding-top: 136px; }
.invite-card {
  position: relative; max-width: 560px; margin: 0 auto; text-align: center; padding: var(--sp-6) var(--sp-5) var(--sp-7);
  border-radius: 36px; background: rgba(255, 255, 255, .9); border: 2px solid #fff; box-shadow: var(--shadow-lift);
}
.invite-card::before { content: ""; position: absolute; inset: 10px; border-radius: 28px; border: 1.5px dashed rgba(169, 139, 234, .45); pointer-events: none; }
.invite-card .peek { width: min(64%, 230px); margin: calc(var(--sp-7) * -1.4) auto var(--sp-2); }
.invite-card h2 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.8rem, 7.5vw, 2.6rem); margin: 0; color: var(--c-accent-2); }
.invite-card .lead { margin: var(--sp-3) auto 0; max-width: 32ch; font-size: var(--fs-md); color: var(--c-ink-soft); font-weight: 600; }
.baby-name { margin: var(--sp-4) 0 0; line-height: 1; }
.baby-name .pre { display: block; font-family: var(--font-display); font-weight: 600; font-size: var(--fs-sm); letter-spacing: .3em; text-transform: uppercase; color: var(--c-ink-soft); }
.baby-name .name {
  display: block; font-family: var(--font-script); font-weight: 700; font-size: var(--fs-name); line-height: 1.15; padding: 0 .1em;
  background: linear-gradient(100deg, #F07AA0, #B36BD8 60%, #6F8FE8); -webkit-background-clip: text; background-clip: text; color: transparent;
}
.divider { display: flex; align-items: center; justify-content: center; gap: var(--sp-3); margin: var(--sp-4) auto; color: var(--c-yellow-deep); }
.divider::before, .divider::after { content: ""; height: 2px; width: 70px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--c-lavender-deep)); }
.divider::after { transform: scaleX(-1); }
.divider img { width: 22px; height: 22px; }
.with-love { margin: 0; font-family: var(--font-display); color: var(--c-ink-soft); font-size: var(--fs-sm); letter-spacing: .08em; }
.parents { margin: var(--sp-1) 0 0; font-family: var(--font-script); font-weight: 700; font-size: clamp(1.9rem, 8vw, 2.6rem); color: var(--c-accent); line-height: 1.2; }
.function-pill { display: inline-block; margin: var(--sp-5) 0 var(--sp-4); padding: .55em 1.3em; border-radius: var(--r-pill); background: linear-gradient(135deg, #FFE1EA, #E9E0FF); font-family: var(--font-display); font-weight: 600; color: var(--c-ink); }
.when-lines { display: grid; gap: var(--sp-2); justify-items: center; font-weight: 700; }
.when-lines p { margin: 0; display: inline-flex; align-items: center; gap: .5em; }
.when-lines svg { width: 20px; height: 20px; color: var(--c-accent-2); }
/* Reveal choreography (runs when the section opens) */
.reveal-section .stagger > * { opacity: 0; transform: translateY(16px) scale(.97); }
body.is-open .reveal-section .stagger > * { animation: rise-in .8s var(--ease-out) forwards; }
body.is-open .reveal-section .stagger > *:nth-child(1) { animation-delay: .15s; }
body.is-open .reveal-section .stagger > *:nth-child(2) { animation-delay: .3s; }
body.is-open .reveal-section .stagger > *:nth-child(3) { animation-delay: .45s; }
body.is-open .reveal-section .stagger > *:nth-child(4) { animation-delay: .6s; }
body.is-open .reveal-section .stagger > *:nth-child(5) { animation-delay: .75s; }
body.is-open .reveal-section .stagger > *:nth-child(6) { animation-delay: .9s; }
body.is-open .reveal-section .stagger > *:nth-child(7) { animation-delay: 1.05s; }
body.is-open .reveal-section .stagger > *:nth-child(8) { animation-delay: 1.2s; }
body.is-open .reveal-section .stagger > *:nth-child(9) { animation-delay: 1.35s; }
body.is-open .invite-card { animation: card-in 1s var(--ease-bounce) both; }
@keyframes card-in { from { opacity: 0; transform: translateY(40px) scale(.92); } to { opacity: 1; transform: none; } }

/* =========================================================================================
   3. EVENT DETAILS
   ========================================================================================= */
.details-section { background: linear-gradient(180deg, #FFF8EF 0%, #FFF1F5 100%); }
.detail-grid { display: grid; gap: var(--sp-5); }
@media (min-width: 760px) { .detail-grid { grid-template-columns: 1fr 1fr; } .detail-grid .span-2 { grid-column: span 2; } }
.card { position: relative; background: #fff; border-radius: var(--r-lg); padding: var(--sp-5); box-shadow: var(--shadow-soft); border: 1px solid rgba(220, 203, 255, .55); }
.card-head { display: flex; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-4); }
.card-head h3 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: var(--fs-lg); }
.card-head .ic { width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center; flex: none; }
.ic-cal { background: linear-gradient(135deg, #FFE1EA, #FFD0DE); }
.ic-pin { background: linear-gradient(135deg, #DDF6EC, #C2EEDB); }
.ic-family { background: linear-gradient(135deg, #EAE2FF, #DCCBFF); }
.ic svg { width: 34px; height: 34px; overflow: visible; }
/* Animated calendar: the page flips and the ring bounces */
.anim-cal .page { transform-box: fill-box; transform-origin: 50% 0; animation: page-flip 3.4s ease-in-out infinite; }
.anim-cal .rings { animation: float-y 1.7s ease-in-out infinite; --float-distance: 2px; }
@keyframes page-flip { 0%, 70%, 100% { transform: rotateX(0); } 80% { transform: rotateX(80deg); } 90% { transform: rotateX(0); } }
/* Animated location pin: bounces with a ripple */
.anim-pin .pin { transform-box: fill-box; transform-origin: 50% 100%; animation: pin-bounce 2s var(--ease-out) infinite; }
.anim-pin .ripple { transform-box: fill-box; transform-origin: center; animation: ripple 2s ease-out infinite; }
@keyframes pin-bounce { 0%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } 50% { transform: translateY(0) scaleY(.9); } 60% { transform: scaleY(1); } }
@keyframes ripple { 0% { transform: scale(.4); opacity: .9; } 100% { transform: scale(1.6); opacity: 0; } }

.big-date { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.25rem, 5.2vw, 1.6rem); margin: 0; line-height: 1.25; }
.time-range { margin: var(--sp-1) 0 0; color: var(--c-ink-soft); font-weight: 700; }
.countdown { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-2); margin: var(--sp-5) 0; }
.cd-tile { text-align: center; padding: var(--sp-3) 0; border-radius: var(--r-md); background: linear-gradient(160deg, #FFF4F8, #F3EDFF); box-shadow: inset 0 0 0 1.5px rgba(255, 196, 214, .6); }
.cd-num { display: block; font-family: var(--font-display); font-weight: 700; font-size: clamp(1.5rem, 7vw, 2.1rem); line-height: 1.1; color: var(--c-accent); font-variant-numeric: tabular-nums; }
.cd-num.tick { animation: tick .45s var(--ease-bounce); }
@keyframes tick { from { transform: translateY(-6px) scale(1.12); } to { transform: none; } }
.cd-label { font-size: var(--fs-xs); font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--c-ink-soft); }
.countdown-done { margin: var(--sp-5) 0; padding: var(--sp-4); border-radius: var(--r-md); text-align: center; background: linear-gradient(135deg, #FFF0C9, #FFE1EA); font-family: var(--font-display); font-weight: 600; font-size: var(--fs-md); }
.countdown-done[hidden], .countdown[hidden] { display: none; }
.venue-name { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.25rem, 5.2vw, 1.6rem); margin: 0; }
.venue-address { margin: var(--sp-1) 0 var(--sp-5); color: var(--c-ink-soft); font-weight: 600; }
.card .btn { width: 100%; }
.family-list { display: grid; gap: var(--sp-3); margin: 0; }
.family-list div { display: flex; justify-content: space-between; gap: var(--sp-3); padding-bottom: var(--sp-3); border-bottom: 1.5px dashed rgba(169, 139, 234, .35); }
.family-list div:last-child { border-bottom: 0; padding-bottom: 0; }
.family-list dt { color: var(--c-ink-soft); font-weight: 700; font-size: var(--fs-sm); }
.family-list dd { margin: 0; font-weight: 800; text-align: right; }
.family-card .teddy { position: absolute; right: -6px; bottom: -14px; width: 92px; opacity: .95; animation: float-tilt 5s ease-in-out infinite; }
.family-card .family-list { padding-right: 70px; }
@media (min-width: 760px) { .family-card .teddy { width: 120px; } .family-card .family-list { padding-right: 110px; } }

/* =========================================================================================
   4. TIMELINE
   ========================================================================================= */
.timeline-section { background: linear-gradient(180deg, #FFF1F5 0%, #EEF7FF 100%); }
.timeline { list-style: none; margin: 0 auto; padding: 0; max-width: 620px; position: relative; }
.timeline::before { content: ""; position: absolute; left: 30px; top: 12px; bottom: 12px; width: 4px; border-radius: 4px; background: linear-gradient(180deg, var(--c-pink), var(--c-lavender), var(--c-blue), var(--c-mint)); }
.t-item { position: relative; display: grid; grid-template-columns: 64px 1fr; gap: var(--sp-4); align-items: start; padding-bottom: var(--sp-5); }
.t-item:last-child { padding-bottom: 0; }
.t-marker { position: relative; z-index: 1; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--mk, var(--c-pink)); box-shadow: 0 0 0 6px #fff, 0 10px 20px rgba(120, 90, 160, .2); color: var(--c-ink); }
.t-marker svg { width: 30px; height: 30px; }
.t-item.in .t-marker { animation: marker-pop .7s var(--ease-bounce) both var(--d, 0ms); }
@keyframes marker-pop { from { transform: scale(.4); } to { transform: scale(1); } }
.t-card { background: #fff; border-radius: var(--r-md); padding: var(--sp-4) var(--sp-5); box-shadow: var(--shadow-soft); }
.t-time { display: inline-block; font-family: var(--font-display); font-weight: 600; font-size: var(--fs-xs); letter-spacing: .1em; padding: .3em .9em; border-radius: var(--r-pill); background: var(--mk-soft, #FFE9F0); color: var(--c-ink); }
.t-card h3 { margin: var(--sp-2) 0 0; font-family: var(--font-display); font-weight: 600; font-size: var(--fs-lg); }
.t-card p { margin: var(--sp-1) 0 0; color: var(--c-ink-soft); font-weight: 600; }

/* =========================================================================================
   5. GALLERY + LIGHTBOX
   ========================================================================================= */
.gallery-section { background: linear-gradient(180deg, #EEF7FF 0%, #FFF8EF 100%); }
.gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--sp-4); }
@media (min-width: 760px) { .gallery { grid-template-columns: repeat(4, 1fr); gap: var(--sp-5); } }
.g-item {
  position: relative; padding: 8px; border: 0; cursor: zoom-in; border-radius: 26px; background: var(--frame, var(--c-pink));
  box-shadow: var(--shadow-soft); transition: transform var(--dur-med) var(--ease-bounce), box-shadow var(--dur-med); -webkit-tap-highlight-color: transparent;
}
.g-item:nth-child(even) { transform: rotate(2deg); }
.g-item:nth-child(odd) { transform: rotate(-2deg); }
.g-item:hover, .g-item:focus-visible { transform: rotate(0) translateY(-6px) scale(1.03); box-shadow: var(--shadow-lift); }
.g-item:active { transform: scale(.98); }
.g-item img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 20px; background: #fff; }
.g-item .cap { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); white-space: nowrap; max-width: 88%; overflow: hidden; text-overflow: ellipsis; padding: .3em .9em; border-radius: var(--r-pill); background: rgba(255,255,255,.88); font-family: var(--font-display); font-weight: 600; font-size: var(--fs-xs); }

.lightbox { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: var(--sp-5) var(--gutter); background: rgba(52, 37, 66, .82); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); opacity: 0; transition: opacity var(--dur-med); }
.lightbox[hidden] { display: none; }
.lightbox.show { opacity: 1; }
.lb-figure { margin: 0; width: min(92vw, 640px); text-align: center; touch-action: pan-y; }
.lb-figure img { width: 100%; max-height: 72svh; object-fit: contain; border-radius: 26px; background: #fff; box-shadow: 0 30px 70px rgba(0,0,0,.35); }
.lb-figure img.slide-next { animation: slide-next .42s var(--ease-out); }
.lb-figure img.slide-prev { animation: slide-prev .42s var(--ease-out); }
@keyframes slide-next { from { opacity: 0; transform: translateX(40px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes slide-prev { from { opacity: 0; transform: translateX(-40px) scale(.97); } to { opacity: 1; transform: none; } }
.lb-figure figcaption { margin-top: var(--sp-3); color: #fff; font-family: var(--font-display); font-weight: 600; }
.lb-figure figcaption span { opacity: .7; font-weight: 500; margin-left: .5em; }
.lb-btn { position: absolute; width: 52px; height: 52px; border-radius: 50%; border: 0; cursor: pointer; background: rgba(255,255,255,.92); color: var(--c-ink); display: grid; place-items: center; box-shadow: 0 10px 24px rgba(0,0,0,.25); }
.lb-btn svg { width: 24px; height: 24px; }
.lb-btn[hidden] { display: none; }
#invite:focus { outline: none; }
.lb-close { top: max(16px, env(safe-area-inset-top)); right: 16px; }
.lb-prev { left: 12px; top: 50%; transform: translateY(-50%); }
.lb-next { right: 12px; top: 50%; transform: translateY(-50%); }
@media (max-width: 600px) { .lb-prev, .lb-next { top: auto; bottom: max(18px, env(safe-area-inset-bottom)); transform: none; } .lb-prev { left: calc(50% - 64px); } .lb-next { right: calc(50% - 64px); } .lb-figure { margin-bottom: 64px; } }

/* =========================================================================================
   6. FAMILY MESSAGE
   ========================================================================================= */
.message-section { background: linear-gradient(180deg, #FFF8EF 0%, #FCEFFF 100%); }
.message-card { position: relative; max-width: 620px; margin: 0 auto; text-align: center; padding: var(--sp-7) var(--sp-5); border-radius: 40px; background: linear-gradient(160deg, #ffffff 0%, #FFF4F8 100%); box-shadow: var(--shadow-lift); }
.message-card .flower { position: absolute; width: 74px; }
.message-card .flower.f1 { top: -30px; left: -14px; transform: rotate(-18deg); animation: float-tilt 6s ease-in-out infinite; }
.message-card .flower.f2 { top: -26px; right: -12px; width: 62px; transform: rotate(16deg); animation: float-tilt 7s ease-in-out infinite -2s; }
.message-card .flower.f3 { bottom: -24px; right: 18%; width: 54px; animation: float-tilt 6.5s ease-in-out infinite -4s; }
.message-card h2 { margin: 0; font-family: var(--font-script); font-weight: 700; font-size: clamp(2.3rem, 10vw, 3.4rem); line-height: 1.1; color: var(--c-accent); }
.message-card p { margin: var(--sp-4) auto 0; max-width: 34ch; font-size: clamp(1.02rem, 4.2vw, 1.18rem); font-weight: 600; color: var(--c-ink-soft); }
.message-card .sign { margin-top: var(--sp-5); font-family: var(--font-display); font-weight: 600; color: var(--c-ink); }
.message-card .hearts { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: 40px; }
.message-card .hearts img { position: absolute; bottom: -24px; width: 18px; opacity: 0; animation: heart-rise 7s ease-in infinite; }
@keyframes heart-rise { 0% { transform: translateY(0) scale(.6); opacity: 0; } 20% { opacity: .45; } 100% { transform: translateY(-340px) scale(1.1); opacity: 0; } }

/* =========================================================================================
   7. CLOSING SCENE
   ========================================================================================= */
.closing-section {
  text-align: center; padding-bottom: calc(var(--sp-8) + env(safe-area-inset-bottom));
  background:
    radial-gradient(60% 40% at 50% 0%, rgba(255,255,255,.9), transparent 70%),
    linear-gradient(180deg, #FCEFFF 0%, #FFE6EE 50%, #FFF1E2 100%);
}
.closing-art { position: relative; width: min(86vw, 460px); margin: 0 auto; }
.closing-art .baby { width: 100%; animation: float-y 6s ease-in-out infinite; }
.closing-art .teddy { position: absolute; width: 32%; right: -6%; bottom: 2%; animation: float-tilt 5s ease-in-out infinite -1s; }
.rise-balloon { position: absolute; bottom: -120px; width: 54px; opacity: .95; animation: rise 14s linear infinite; z-index: 1; }
@keyframes rise { 0% { transform: translate(0, 0) rotate(-4deg); } 50% { transform: translate(18px, -400px) rotate(4deg); } 100% { transform: translate(-10px, -820px) rotate(-3deg); } }
.closing-section h2 { margin: var(--sp-4) 0 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(1.6rem, 7vw, 2.5rem); line-height: 1.15; }
.closing-section .name { margin: var(--sp-3) 0 0; font-family: var(--font-script); font-weight: 700; font-size: clamp(2.6rem, 12vw, 3.8rem); line-height: 1.1; color: var(--c-accent); }
.closing-meta { margin: var(--sp-3) auto 0; display: grid; gap: var(--sp-1); font-weight: 700; color: var(--c-ink-soft); }
.closing-meta p { margin: 0; }
.actions { margin: var(--sp-6) auto 0; display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); max-width: 520px; }
.actions .btn { width: 100%; padding-left: .8em; padding-right: .8em; font-size: var(--fs-sm); }
.actions .wide { grid-column: span 2; font-size: var(--fs-md); }
.confetti-piece { position: absolute; top: -20px; width: 9px; height: 14px; border-radius: 3px; opacity: .85; animation: fall linear infinite; z-index: 1; }
@keyframes fall { 0% { transform: translateY(0) rotate(0); } 100% { transform: translateY(var(--fall, 900px)) rotate(540deg); } }
.footer-note { margin-top: var(--sp-6); font-size: var(--fs-xs); color: var(--c-ink-soft); opacity: .8; }

/* Sections out of view pause their animations, so only what is on screen costs anything. */
.offscreen, .offscreen * { animation-play-state: paused !important; }

/* Side decorations only where there is room beside the content */
.side-deco { display: none; }
@media (min-width: 900px) { .side-deco { display: block; } }

/* Small phones */
@media (max-width: 370px) {
  .intro { padding-top: 52px; }
  .card { padding: var(--sp-4); }
  .actions { grid-template-columns: 1fr; }
  .actions .wide { grid-column: auto; }
}
/* Short screens: keep everything above the fold */
@media (max-height: 640px) {
  .hero-baby { width: min(56vw, 38svh, 320px); }
  .balloon { --bw: clamp(62px, 18vw, 96px); }
  .balloon.b1 { top: 10%; } .balloon.b2 { top: 14%; } .balloon.b3 { top: 56%; } .balloon.b4 { top: 52%; }
  .intro .subtitle { font-size: .92rem; }
  .intro h1 { margin-top: var(--sp-2); }
}
@media (min-width: 900px) {
  .balloon.b1 { left: 6%; } .balloon.b2 { right: 6%; } .balloon.b3 { left: 13%; } .balloon.b4 { right: 12%; }
}

/* =========================================================================================
   REDUCED MOTION — no floating, drifting, confetti or parallax; content simply fades in.
   ========================================================================================= */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; animation-delay: 0ms !important; transition-duration: 1ms !important; }
  .butterfly, .intro .cloud.drift, .rise-balloon, .confetti-piece, .message-card .hearts { display: none; }
  [data-reveal] { opacity: 1; transform: none; }
}
</style>

  <button class="lb-btn lb-close" id="lbClose" type="button" aria-label="Close photo viewer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>

<canvas id="confetti" aria-hidden="true"></canvas>

<script>
/* =========================================================================================
   INVITATION DATA — the ONLY place to change the customer's details.
   Everything on the page (text, dates, countdown, calendar link, maps link, timeline,
   gallery, share message, page title) is rendered from this object.
   ========================================================================================= */
const invitationData = {
  templateName: "Baby Celebration",

  // Baby & family
  babyTitle: "Baby",                       // shown before the name, e.g. "Baby Aarav"
  babyName: "Aarav",
  parentsNames: "Arjun & Priya",
  grandparentsNames: "Raman & Lakshmi · Kumar & Meena",   // optional — "" hides the row

  // Wording
  functionTitle: "Baby Welcome Ceremony",
  inviteKicker: "You're Invited to Celebrate",
  heading: "A Little Bundle of Joy!",
  subtitle: "Our family is growing, and our hearts are overflowing with happiness.",
  tapHint: "Tap a Balloon to Open Your Invitation 🎈",
  revealTitle: "You're Invited!",
  inviteLine: "Join us as we celebrate the arrival of our little bundle of joy.",
  familyMessageTitle: "Little Hands, Big Love",
  familyMessage: "Our little one has filled our world with happiness. We would love for you to join our family as we celebrate this precious new chapter.",
  closingMessage: "We Can't Wait to Celebrate With You!",

  // When — local time at the venue, plus the venue's UTC offset and time zone
  eventDate: "2026-11-21T10:30:00",
  eventEndDate: "2026-11-21T14:00:00",     // optional — used for the time range and calendar
  utcOffset: "+05:30",
  timeZone: "Asia/Kolkata",

  // Where
  venueName: "Sri Mahal",
  venueAddress: "12 Temple Road, T. Nagar, Chennai, Tamil Nadu 600017",
  googleMapsUrl: "https://www.google.com/maps/search/?api=1&query=Sri%20Mahal%2C%20T.%20Nagar%2C%20Chennai",  // "" = search for the venue

  // Programme — any number of items. icon: blessing | party | lunch | cake | music | gift | camera
  events: [
    { time: "10:30 AM", title: "Welcome & Blessings", description: "Greet the little one and shower him with blessings.", icon: "blessing" },
    { time: "11:00 AM", title: "Family Celebration", description: "Games, giggles, photos and plenty of happy tears.", icon: "party" },
    { time: "12:30 PM", title: "Lunch", description: "A traditional feast with the whole family.", icon: "lunch" },
  ],

  // Photos — any number. Strings or { src, caption }. Leave empty to show the built-in illustrations.
  galleryImages: [],

  // Optional custom WhatsApp text; "" builds one from the details above. {url} = this page's link.
  shareMessage: "",
};

/* =========================================================================================
   APP
   ========================================================================================= */
(() => {
  "use strict";

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  // Lighter effects on low-end phones (few CPU cores or little memory).
  const lowEnd = (navigator.hardwareConcurrency || 8) <= 4 || (navigator.deviceMemory || 8) <= 3;
  const state = { opened: false, popping: false };

  const DEFAULT_GALLERY = [
    { src: "assets/baby-gallery-1.svg", caption: "Sweet Dreams" },
    { src: "assets/baby-gallery-2.svg", caption: "Little Explorer" },
    { src: "assets/baby-gallery-3.svg", caption: "Tiny Toes" },
    { src: "assets/baby-gallery-4.svg", caption: "Hello, World!" },
  ];
  const BALLOONS = [
    { name: "pink", light: "#FFD3E1", base: "#FFB3CB", deep: "#F07FA2" },
    { name: "blue", light: "#D8EEFF", base: "#A9D8FA", deep: "#6EB6EA" },
    { name: "yellow", light: "#FFF1C4", base: "#FFE08A", deep: "#F5BE45" },
    { name: "mint", light: "#DDF7EC", base: "#ABE6CD", deep: "#62C79F" },
  ];
  const PASTELS = ["#FFC4D6", "#BFE3FF", "#FFE7A3", "#C8F0DF", "#DCCBFF", "#FFD7BF"];
  const PASTEL_SOFT = ["#FFEAF1", "#E8F5FF", "#FFF6DA", "#E6F9F1", "#F1EAFF", "#FFEFE5"];

  /* ---------- formatting ---------- */
  const toDate = (local) => (local ? new Date(local + invitationData.utcOffset) : null);
  const fmt = (date, opts) => new Intl.DateTimeFormat("en-IN", { timeZone: invitationData.timeZone, ...opts }).format(date);
  function formatLongDate(date) {
    const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: invitationData.timeZone, weekday: "long", day: "numeric", month: "long", year: "numeric" }).formatToParts(date).map((x) => [x.type, x.value]));
    return `${p.weekday}, ${p.day} ${p.month} ${p.year}`;
  }
  const formatTime = (date) => fmt(date, { hour: "numeric", minute: "2-digit", hour12: true }).replace(/\s?(am|pm)$/i, (m) => " " + m.trim().toUpperCase());

  function buildView(d) {
    const start = toDate(d.eventDate);
    const end = toDate(d.eventEndDate);
    const babyFullName = [d.babyTitle, d.babyName].filter(Boolean).join(" ");
    return {
      ...d,
      start,
      end,
      babyFullName,
      parentsLine: d.parentsNames ? `with love, ${d.parentsNames}` : "",
      dateLong: formatLongDate(start),
      dayNumber: fmt(start, { day: "numeric" }),
      timeOnwards: `${formatTime(start)} onwards`,
      timeRange: end ? `${formatTime(start)} – ${formatTime(end)}` : `${formatTime(start)} onwards`,
      dateWithTime: `${formatLongDate(start)} · ${formatTime(start)}`,
      venueLine: [d.venueName, d.venueAddress].filter(Boolean).join(", "),
      mapsUrl: d.googleMapsUrl || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([d.venueName, d.venueAddress].filter(Boolean).join(", "))}`,
    };
  }
  const view = buildView(invitationData);

  /* ---------- text & links ---------- */
  function updateDetails() {
    document.title = `${view.babyFullName} · ${view.functionTitle}`;
    $$("[data-bind]").forEach((el) => {
      const value = view[el.dataset.bind];
      if (value != null) el.textContent = value;
    });
    $("#directionsBtn").href = view.mapsUrl;
    $("#calendarBtn").href = calendarUrl();
    $("#shareBtn").href = whatsappUrl();

    const rows = [
      ["Little one", view.babyFullName],
      ["Parents", view.parentsNames],
      ["Grandparents", view.grandparentsNames],
    ].filter(([, v]) => v && String(v).trim());
    $("#familyList").innerHTML = rows.map(([k, v]) => `<div><dt>${escapeHtml(k)}</dt><dd>${escapeHtml(v)}</dd></div>`).join("");
  }

  function calendarUrl() {
    const z = (d) => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
    const end = view.end || new Date(view.start.getTime() + 3 * 3600 * 1000);
    const params = new URLSearchParams({
      action: "TEMPLATE",
      text: `${view.functionTitle} — ${view.babyFullName}`,
      dates: `${z(view.start)}/${z(end)}`,
      details: `${view.inviteLine}\n\nInvitation: ${pageUrl()}`,
      location: view.venueLine,
    });
    return `https://calendar.google.com/calendar/render?${params}`;
  }

  const pageUrl = () => location.href.split("#")[0];

  function whatsappUrl() {
    const text = view.shareMessage
      ? view.shareMessage.replace("{url}", pageUrl())
      : `🎈 You're invited to the ${view.functionTitle} of ${view.babyFullName}!\n\n📅 ${view.dateLong}, ${view.timeOnwards}\n📍 ${view.venueLine}\n\nOpen the invitation: ${pageUrl()}`;
    return `https://wa.me/?text=${encodeURIComponent(text)}`;
  }

  const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

  /* ---------- icons ---------- */
  const ICONS = {
    blessing: '<path d="M12 3c2.5 3 3.5 5.4 3.5 7.4A3.5 3.5 0 0112 14a3.5 3.5 0 01-3.5-3.6C8.5 8.4 9.5 6 12 3z"/><path d="M5 21h14M7 21c0-3 2-5 5-5s5 2 5 5"/>',
    party: '<path d="M4 20l5-14 9 9-14 5z"/><path d="M14 4l1-1M19 9l1-1M17 3l.5 2M21 7l-2 .5M13 9c1.5-1.5 3-2 4-1"/>',
    lunch: '<path d="M5 3v7a2 2 0 002 2v9M9 3v7a2 2 0 01-2 2M7 3v6"/><path d="M17 21V3c-2 1.5-3 4-3 7v3h3"/>',
    cake: '<path d="M4 21h16M5 21v-7a2 2 0 012-2h10a2 2 0 012 2v7"/><path d="M5 16c1.5 1 3 1 4.5 0s3-1 4.5 0 3 1 5 0M12 12V8M12 5.5c.8-.8.8-1.7 0-2.5-.8.8-.8 1.7 0 2.5z"/>',
    music: '<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
    gift: '<rect x="3.5" y="8" width="17" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12M12 8c-2-4-6-4-6-1.5S12 8 12 8zm0 0c2-4 6-4 6-1.5S12 8 12 8z"/>',
    camera: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  };
  const icon = (name) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ICONS.party}</svg>`;
  const SPEAKER_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>';
  const SPEAKER_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 5M22 9l-5 5"/></svg>';
  const REPLAY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 103-6.7"/><path d="M3 4v5h5"/></svg>';

  /* ---------- timeline ---------- */
  function renderEvents() {
    const list = $("#timelineList");
    const events = invitationData.events || [];
    $("#timeline").hidden = events.length === 0;
    list.innerHTML = events
      .map((e, i) => `
        <li class="t-item" data-reveal style="--d:${i * 110}ms; --mk:${PASTELS[i % PASTELS.length]}; --mk-soft:${PASTEL_SOFT[i % PASTEL_SOFT.length]}">
          <span class="t-marker">${icon(e.icon)}</span>
          <div class="t-card">
            ${e.time ? `<span class="t-time">${escapeHtml(e.time)}</span>` : ""}
            <h3>${escapeHtml(e.title || "")}</h3>
            ${e.description ? `<p>${escapeHtml(e.description)}</p>` : ""}
          </div>
        </li>`)
      .join("");
  }

  /* ---------- gallery + lightbox ---------- */
  let gallery = [];
  function renderGallery() {
    const raw = (invitationData.galleryImages || []).filter(Boolean);
    gallery = (raw.length ? raw : DEFAULT_GALLERY).map((g, i) =>
      typeof g === "string" ? { src: g, caption: `Moment ${i + 1}` } : { src: g.src, caption: g.caption || `Moment ${i + 1}` }
    );
    $("#galleryGrid").innerHTML = gallery
      .map((g, i) => `
        <button class="g-item" type="button" data-index="${i}" data-reveal style="--d:${i * 90}ms; --frame:${PASTELS[i % PASTELS.length]}" aria-label="Open photo: ${escapeHtml(g.caption)}">
          <img src="${escapeHtml(g.src)}" alt="${escapeHtml(g.caption)}" loading="lazy">
          <span class="cap">${escapeHtml(g.caption)}</span>
        </button>`)
      .join("");
    // A missing customer photo falls back to an illustration instead of a broken image.
    $$("#galleryGrid img").forEach((img, i) => {
      img.addEventListener("error", () => {
        const fallback = DEFAULT_GALLERY[i % DEFAULT_GALLERY.length].src;
        if (!img.src.endsWith(fallback)) { img.src = fallback; gallery[i].src = fallback; }
      }, { once: true });
    });
    $$("#galleryGrid .g-item").forEach((b) => b.addEventListener("click", () => openLightbox(+b.dataset.index, b)));
  }

  const lb = { index: 0, opener: null };
  function openLightbox(index, opener) {
    lb.opener = opener;
    const box = $("#lightbox");
    box.hidden = false;
    document.documentElement.classList.add("lightbox-open");
    showSlide(index, 0);
    requestAnimationFrame(() => box.classList.add("show"));
    $("#lbClose").focus();
  }
  function closeLightbox() {
    const box = $("#lightbox");
    box.classList.remove("show");
    document.documentElement.classList.remove("lightbox-open");
    setTimeout(() => { box.hidden = true; }, reducedMotion ? 0 : 300);
    lb.opener?.focus();
  }
  function showSlide(index, dir) {
    lb.index = (index + gallery.length) % gallery.length;
    const g = gallery[lb.index];
    const img = $("#lbImg");
    img.classList.remove("slide-next", "slide-prev");
    void img.offsetWidth;
    img.src = g.src;
    img.alt = g.caption;
    if (dir) img.classList.add(dir > 0 ? "slide-next" : "slide-prev");
    $("#lbCaption").textContent = g.caption;
    $("#lbCount").textContent = `${lb.index + 1} / ${gallery.length}`;
    const single = gallery.length < 2;
    $("#lbPrev").hidden = single;
    $("#lbNext").hidden = single;
  }
  function initLightbox() {
    $("#lbClose").addEventListener("click", closeLightbox);
    $("#lbPrev").addEventListener("click", () => showSlide(lb.index - 1, -1));
    $("#lbNext").addEventListener("click", () => showSlide(lb.index + 1, 1));
    $("#lightbox").addEventListener("click", (e) => { if (e.target.id === "lightbox") closeLightbox(); });
    document.addEventListener("keydown", (e) => {
      if ($("#lightbox").hidden) return;
      if (e.key === "Escape") closeLightbox();
      else if (e.key === "ArrowLeft") showSlide(lb.index - 1, -1);
      else if (e.key === "ArrowRight") showSlide(lb.index + 1, 1);
      else if (e.key === "Tab") {
        // keep focus inside the viewer
        const f = $$("#lightbox button:not([hidden])");
        const i = f.indexOf(document.activeElement);
        if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
      }
    });
    let sx = 0, sy = 0;
    const fig = $("#lbFigure");
    fig.addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
    fig.addEventListener("touchend", (e) => {
      const dx = e.changedTouches[0].clientX - sx;
      const dy = e.changedTouches[0].clientY - sy;
      if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) showSlide(lb.index + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1);
    }, { passive: true });
  }

  /* ---------- countdown ---------- */
  let countdownTimer = null;
  function updateCountdown() {
    const now = Date.now();
    const start = view.start.getTime();
    const end = (view.end || new Date(start + 4 * 3600 * 1000)).getTime();
    const box = $("#countdown");
    const done = $("#countdownDone");
    if (now >= start) {
      box.hidden = true;
      done.hidden = false;
      done.textContent = now < end ? "🎉 The celebration is happening right now — come join us!" : `💛 Thank you for celebrating ${view.babyFullName} with us!`;
      if (now >= end) clearInterval(countdownTimer);
      return;
    }
    box.hidden = false;
    done.hidden = true;
    let s = Math.floor((start - now) / 1000);
    const parts = { days: Math.floor(s / 86400), hours: Math.floor((s %= 86400) / 3600), minutes: Math.floor((s %= 3600) / 60), seconds: s % 60 };
    for (const [k, v] of Object.entries(parts)) {
      const el = box.querySelector(`[data-cd="${k}"]`);
      const text = String(v).padStart(2, "0");
      if (el.textContent !== text) {
        el.textContent = text;
        if (!reducedMotion) { el.classList.remove("tick"); void el.offsetWidth; el.classList.add("tick"); }
      }
    }
  }
  function startCountdown() {
    updateCountdown();
    countdownTimer = setInterval(updateCountdown, 1000);
  }

  /* ---------- sound (off by default; plays only after a tap) ---------- */
  const sound = {
    on: false,
    ctx: null,
    toggle() {
      this.on = !this.on;
      if (this.on && !this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) this.ctx = new AC();
      }
      this.ctx?.resume?.();
      const btn = $("#soundBtn");
      btn.setAttribute("aria-pressed", String(this.on));
      btn.setAttribute("aria-label", this.on ? "Turn sound off" : "Turn sound on");
      btn.innerHTML = this.on ? SPEAKER_ON : SPEAKER_OFF;
      if (this.on) this.chime();
    },
    pop() {
      if (!this.on || !this.ctx) return;
      const ctx = this.ctx, t = ctx.currentTime;
      const buf = ctx.createBuffer(1, ctx.sampleRate * 0.12, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 3);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const filter = ctx.createBiquadFilter();
      filter.type = "bandpass"; filter.frequency.value = 1400; filter.Q.value = 0.8;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.55, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      src.connect(filter).connect(gain).connect(ctx.destination);
      src.start(t);
      setTimeout(() => this.chime(), 160);
    },
    chime() {
      if (!this.on || !this.ctx) return;
      const ctx = this.ctx;
      [784, 988, 1175].forEach((f, i) => {
        const t = ctx.currentTime + i * 0.09;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine"; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.12, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
        o.connect(g).connect(ctx.destination);
        o.start(t); o.stop(t + 0.55);
      });
    },
  };

  /* ---------- confetti (canvas) ---------- */
  const confetti = (() => {
    const canvas = $("#confetti");
    const ctx = canvas.getContext("2d");
    let parts = [], running = false, dpr = 1;
    const COLORS = ["#FFB3CB", "#A9D8FA", "#FFE08A", "#ABE6CD", "#C8B4FF", "#FFD7BF", "#ffffff"];
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
    }
    function burst(x, y, accent, count = 70) {
      if (reducedMotion) return;
      if (lowEnd) count = Math.round(count * 0.5);
      resize();
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 3 + Math.random() * 7;
        parts.push({
          x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 3, g: 0.16 + Math.random() * 0.08,
          size: 5 + Math.random() * 6, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
          color: i % 4 === 0 ? accent : COLORS[(Math.random() * COLORS.length) | 0],
          shape: Math.random() < 0.35 ? "circle" : Math.random() < 0.5 ? "heart" : "rect", life: 1,
        });
      }
      if (!running) { running = true; requestAnimationFrame(tick); }
    }
    function drawHeart(s) {
      ctx.beginPath();
      ctx.moveTo(0, s * 0.3);
      ctx.bezierCurveTo(-s, -s * 0.4, -s * 0.4, -s, 0, -s * 0.45);
      ctx.bezierCurveTo(s * 0.4, -s, s, -s * 0.4, 0, s * 0.3);
      ctx.fill();
    }
    function tick() {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      parts = parts.filter((p) => p.life > 0 && p.y < innerHeight + 40);
      for (const p of parts) {
        p.vx *= 0.985; p.vy = p.vy * 0.985 + p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= 0.006;
        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.5));
        ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color;
        if (p.shape === "circle") { ctx.beginPath(); ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2); ctx.fill(); }
        else if (p.shape === "heart") drawHeart(p.size * 0.8);
        else ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        ctx.restore();
      }
      if (parts.length) requestAnimationFrame(tick);
      else { running = false; ctx.clearRect(0, 0, canvas.width, canvas.height); }
    }
    addEventListener("resize", () => running && resize());
    return { burst };
  })();

  /* ---------- balloons ---------- */
  // Each balloon is its own button: any of them can be popped, in any order. The first pop
  // opens the invitation; the rest stay up and can still be popped just for fun.
  function renderBalloons() {
    const stage = $("#stage");
    BALLOONS.forEach((c, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = `balloon b${i + 1}`;
      b.setAttribute("aria-label", `Pop the ${c.name} balloon`);
      b.dataset.color = c.base;
      b.style.setProperty("--burst", c.deep);
      b.innerHTML = `
        <svg class="b-string" viewBox="0 0 30 80" aria-hidden="true"><path d="M15 0 C9 18 22 32 13 50 C9 60 17 70 15 80" fill="none" stroke="#B5A3C8" stroke-width="2" stroke-linecap="round"/></svg>
        <img class="b-body" src="assets/balloon-body-${c.name}.svg" alt="" draggable="false">
        <span class="b-burst" aria-hidden="true"></span>`;
      b.addEventListener("pointerdown", () => { b.classList.remove("press"); void b.offsetWidth; b.classList.add("press"); });
      b.addEventListener("click", () => popBalloon(b));
      stage.appendChild(b);
    });
  }
  function popBalloon(btn) {
    if (btn.classList.contains("popping")) return;   // a balloon pops only once
    btn.classList.add("popping");
    btn.setAttribute("aria-hidden", "true");
    btn.tabIndex = -1;
    sound.pop();
    const r = btn.getBoundingClientRect();
    confetti.burst(r.left + r.width / 2, r.top + r.height * 0.45, btn.dataset.color);
    if (!state.opened && !state.popping) {
      state.popping = true;                          // later taps during the reveal only pop balloons
      setTimeout(revealInvitation, reducedMotion ? 60 : 650);
    }
  }
  function revealInvitation() {
    document.body.classList.add("is-open");
    state.opened = true;
    state.popping = false;
    $("#replayTop").hidden = false;
    observeReveals();
    setTimeout(() => {
      const target = $("#invite");
      target.scrollIntoView({ behavior: reducedMotion ? "auto" : "smooth", block: "start" });
      target.focus({ preventScroll: true });
    }, reducedMotion ? 0 : 350);
  }
  function replay() {
    window.scrollTo({ top: 0, behavior: reducedMotion ? "auto" : "smooth" });
    const started = Date.now();
    const waitTop = () => {
      if (window.scrollY > 4 && Date.now() - started < 1500) return requestAnimationFrame(waitTop);
      document.body.classList.remove("is-open");
      $("#replayTop").hidden = true;
      state.opened = false;
      state.popping = false;
      $$(".balloon").forEach((b) => {
        b.classList.remove("popping", "press");
        b.removeAttribute("aria-hidden");
        b.tabIndex = 0;
        b.style.animation = "none";
        void b.offsetWidth;
        b.style.animation = "";
      });
      $$("[data-reveal].in").forEach((el) => el.classList.remove("in"));
      closingCelebrated = false;
      $(".balloon")?.focus({ preventScroll: true });
    };
    requestAnimationFrame(waitTop);
  }

  /* ---------- scroll reveal ---------- */
  let io = null;
  let closingCelebrated = false;
  function observeReveals() {
    if (!("IntersectionObserver" in window) || reducedMotion) {
      $$("[data-reveal]").forEach((el) => el.classList.add("in"));
      return;
    }
    io?.disconnect();
    io = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        e.target.classList.add("in");
        io.unobserve(e.target);
        if (e.target.closest("#closing") && !closingCelebrated) {
          closingCelebrated = true;
          const r = $("#closing .closing-art").getBoundingClientRect();
          confetti.burst(r.left + r.width / 2, r.top + r.height * 0.4, "#FFB3CB", 50);
        }
      }
    }, { threshold: 0.18, rootMargin: "0px 0px -6% 0px" });
    $$("[data-reveal]:not(.in)").forEach((el) => io.observe(el));
  }

  /* ---------- ambient effects ---------- */
  function renderAmbient() {
    // Twinkling stars on the opening screen (seeded so they don't jump between visits)
    let seed = 7;
    const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
    const far = $("#layerFar");
    for (let i = 0; i < (lowEnd ? 9 : 16); i++) {
      const st = document.createElement("img");
      st.className = "deco deco-star";
      st.src = `assets/star-${["gold", "pink", "lavender", "blue"][i % 4]}.svg`;
      st.alt = "";
      const size = 9 + rnd() * 12;
      st.style.cssText = `left:${rnd() * 96}%;top:${rnd() * 70}%;width:${size}px;height:${size}px;animation-delay:${-rnd() * 3}s;animation-duration:${2.4 + rnd() * 2.4}s`;
      far.appendChild(st);
    }
    if (reducedMotion) return;
    // Rising balloons + gentle confetti in the closing scene
    const fx = $("#closingFx");
    ["pink", "blue", "yellow", "mint", "lavender", "pink", "blue"].forEach((c, i) => {
      const img = document.createElement("img");
      img.src = `assets/pastel-balloon-${c}.svg`;
      img.alt = "";
      img.className = "rise-balloon";
      img.style.cssText = `left:${[3, 86, 12, 74, 20, 92, 64][i]}%;animation-delay:${-i * 2.1}s;animation-duration:${12 + (i % 3) * 2.5}s;width:${40 + (i % 3) * 10}px`;
      fx.appendChild(img);
    });
    for (let i = 0; i < (lowEnd ? 10 : 22); i++) {
      const p = document.createElement("span");
      p.className = "confetti-piece";
      p.style.cssText = `left:${(i % 2 ? 86 : 0) + rnd() * 14}%;background:${PASTELS[i % PASTELS.length]};animation-duration:${7 + rnd() * 7}s;animation-delay:${-rnd() * 10}s;--fall:${900 + rnd() * 400}px;width:${6 + rnd() * 6}px;height:${10 + rnd() * 8}px;border-radius:${i % 3 ? 3 : 50}px`;
      fx.appendChild(p);
    }
    const hearts = $("#hearts");
    for (let i = 0; i < (lowEnd ? 4 : 8); i++) {
      const h = document.createElement("img");
      h.src = `assets/heart-${i % 2 ? "lavender" : "pink"}.svg`;
      h.alt = "";
      h.style.cssText = `left:${8 + i * 11.5}%;animation-delay:${-i * 0.9}s;width:${14 + (i % 3) * 5}px`;
      hearts.appendChild(h);
    }
  }

  /* ---------- parallax on the opening screen ---------- */
  function initParallax() {
    if (reducedMotion) return;
    const intro = $("#intro");
    const layers = $$("[data-depth]", intro);
    let px = 0, py = 0, queued = false;
    const apply = () => {
      queued = false;
      const sy = Math.min(window.scrollY, innerHeight);
      layers.forEach((el) => {
        const d = +el.dataset.depth;
        el.style.transform = `translate3d(${px * d * 28}px, ${py * d * 18 + sy * d * 0.35}px, 0)`;
      });
    };
    const queue = () => { if (!queued) { queued = true; requestAnimationFrame(apply); } };
    if (window.matchMedia("(pointer: fine)").matches) {
      intro.addEventListener("pointermove", (e) => { px = e.clientX / innerWidth - 0.5; py = e.clientY / innerHeight - 0.5; queue(); });
    }
    addEventListener("scroll", queue, { passive: true });
  }

  /* ---------- share, copy, navigation ---------- */
  let toastTimer = null;
  function toast(message, isError = false) {
    const t = $("#toast");
    t.textContent = message;
    t.classList.toggle("error", isError);
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
  }
  async function copyLink() {
    const url = pageUrl();
    let ok = false;
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(url);
        ok = true;
      }
    } catch { ok = false; }
    if (!ok) {
      const ta = document.createElement("textarea");
      ta.value = url;
      ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;top:-100px;opacity:0";
      document.body.appendChild(ta);
      ta.select();
      try { ok = document.execCommand("copy"); } catch { ok = false; }
      ta.remove();
    }
    ok ? toast("Invitation link copied! 💌") : toast("Couldn't copy — please copy the link from your browser's address bar.", true);
  }
  function initActions() {
    $("#copyBtn").addEventListener("click", copyLink);
    $("#replayBtn").addEventListener("click", replay);
    $("#replayTop").addEventListener("click", replay);
    $("#replayTop").innerHTML = REPLAY;
    $("#topBtn").addEventListener("click", () => window.scrollTo({ top: 0, behavior: reducedMotion ? "auto" : "smooth" }));
    $("#soundBtn").innerHTML = SPEAKER_OFF;
    $("#soundBtn").addEventListener("click", () => sound.toggle());
    // Keep the share link pointing at the current address (e.g. after a hash change)
    addEventListener("hashchange", () => { $("#shareBtn").href = whatsappUrl(); $("#calendarBtn").href = calendarUrl(); });
  }

  /* ---------- pause animations in sections that are off screen ---------- */
  function initOffscreenPause() {
    if (!("IntersectionObserver" in window)) return;
    const obs = new IntersectionObserver((entries) => {
      for (const e of entries) e.target.classList.toggle("offscreen", !e.isIntersecting);
    }, { rootMargin: "120px 0px" });
    $$("main > section").forEach((sec) => obs.observe(sec));
  }

  /* ---------- start ---------- */
  updateDetails();
  renderEvents();
  renderGallery();
  renderBalloons();
  renderAmbient();
  initLightbox();
  initParallax();
  initActions();
  startCountdown();
  initOffscreenPause();
})();
</script>
<noscript><style>.after-open{display:block!important}.tap-hint,.balloon{display:none}</style></noscript>
</body>
</html>
